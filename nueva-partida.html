<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva Partida</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@700;800&display=swap');

  :root{
    --bg-modal: #1c1c1e;
    --bg-card: #2a2a2c;
    --bg-card-value: #0f0f10;
    --border-subtle: #3a3a3c;
    --text-main: #f5f5f5;
    --text-dim: #9a9a9d;
    --accent: #f0532d;
    --accent-dim: #3a2015;
    --accent-glow: rgba(240, 83, 45, 0.45);
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
    background: #0a0a0b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-main);
    -webkit-font-smoothing: antialiased;
  }

  .modal{
    width: 620px;
    max-width: 92vw;
    background: var(--bg-modal);
    border: 1px solid var(--border-subtle);
    border-radius: 18px;
    padding: 36px 40px 32px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.55);
    user-select: none;
  }

  .modal h1{
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 26px;
    text-align: center;
    margin: 0 0 20px;
    letter-spacing: 0.2px;
  }

  .divider{
    height: 1px;
    background: var(--border-subtle);
    margin: 0 0 28px;
  }

  .section-label{
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--text-main);
    text-decoration: underline;
    text-decoration-color: #3a6df0;
    text-underline-offset: 6px;
    margin-bottom: 22px;
  }

  .difficulty-track{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 26px;
    touch-action: none;
  }

  .diff-card{
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    border: 1px solid var(--border-subtle);
    background: var(--bg-card);
    transition: border-color 0.15s ease, transform 0.1s ease, box-shadow 0.2s ease;
  }

  .diff-card:active{ transform: scale(0.98); }

  .diff-name{
    font-size: 15px;
    font-weight: 500;
    color: var(--text-dim);
    text-align: center;
    padding: 14px 8px 10px;
    transition: color 0.15s ease, background 0.15s ease;
    white-space: nowrap;
  }

  .diff-value{
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    padding: 12px 6px;
    background: var(--bg-card-value);
    color: var(--text-main);
    white-space: nowrap;
    letter-spacing: 0.5px;
  }

  .diff-card.selected{
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 0 18px var(--accent-glow);
  }

  .diff-card.selected .diff-name{
    background: var(--accent-dim);
    color: var(--accent);
  }

  .diff-card.selected .diff-value{
    background: var(--accent);
    color: #1c0a04;
  }

  .diff-card.dragging-over .diff-name{
    color: var(--text-main);
  }

  .note{
    text-align: center;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--text-dim);
    max-width: 460px;
    margin: 0 auto 28px;
  }

  .note strong{
    color: #c7c7c9;
    font-weight: 600;
  }

  .start-btn{
    display: block;
    width: 240px;
    margin: 0 auto;
    padding: 14px 0;
    border: none;
    border-radius: 9px;
    background: var(--accent);
    color: #1c0a04;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .start-btn:hover{ background: #ff6a41; }
  .start-btn:active{ transform: scale(0.97); }

  @media (max-width: 480px){
    .difficulty-track{ grid-template-columns: repeat(2, 1fr); }
    .modal{ padding: 28px 20px 26px; }
  }
</style>
</head>
<body>

<div class="modal">
  <h1>Nueva Partida</h1>
  <div class="divider"></div>

  <div class="section-label">Tamaño del Tablero</div>

  <div class="difficulty-track" id="track">
    <div class="diff-card selected" data-index="0">
      <div class="diff-name">Fácil</div>
      <div class="diff-value">9×9</div>
    </div>
    <div class="diff-card" data-index="1">
      <div class="diff-name">Intermedio</div>
      <div class="diff-value">16×16</div>
    </div>
    <div class="diff-card" data-index="2">
      <div class="diff-name">Avanzado</div>
      <div class="diff-value">16×30</div>
    </div>
    <div class="diff-card" data-index="3">
      <div class="diff-name">Experto</div>
      <div class="diff-value">20×30</div>
    </div>
  </div>

  <div class="note">
    Nota: Las partidas jugadas solo serán guardadas si se presiona en el botón <strong>"Guardar"</strong> al finalizarla ó si el jugador logra un nuevo récord personal
  </div>

  <button class="start-btn" id="startBtn">Empezar</button>
</div>

<script>
  const track = document.getElementById('track');
  const cards = Array.from(track.querySelectorAll('.diff-card'));
  const startBtn = document.getElementById('startBtn');

  let selectedIndex = 0;
  let isDragging = false;

  function selectCard(index){
    if(index === selectedIndex) return;
    selectedIndex = index;
    cards.forEach((card, i) => {
      card.classList.toggle('selected', i === index);
    });
  }

  function cardFromPoint(x, y){
    const el = document.elementFromPoint(x, y);
    if(!el) return null;
    return el.closest('.diff-card');
  }

  function handlePointerDown(e){
    isDragging = true;
    track.setPointerCapture(e.pointerId);
    const card = cardFromPoint(e.clientX, e.clientY);
    if(card){
      selectCard(Number(card.dataset.index));
    }
  }

  function handlePointerMove(e){
    if(!isDragging) return;
    const card = cardFromPoint(e.clientX, e.clientY);
    cards.forEach(c => c.classList.remove('dragging-over'));
    if(card){
      card.classList.add('dragging-over');
      selectCard(Number(card.dataset.index));
    }
  }

  function handlePointerUp(){
    isDragging = false;
    cards.forEach(c => c.classList.remove('dragging-over'));
  }

  cards.forEach(card => {
    card.addEventListener('pointerdown', handlePointerDown);
  });

  track.addEventListener('pointermove', handlePointerMove);
  window.addEventListener('pointerup', handlePointerUp);
  window.addEventListener('pointercancel', handlePointerUp);

  // Navegación por teclado (accesibilidad)
  cards.forEach(card => {
    card.setAttribute('tabindex', '0');
    card.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        selectCard(Number(card.dataset.index));
      }
      if(e.key === 'ArrowRight'){
        selectCard(Math.min(selectedIndex + 1, cards.length - 1));
        cards[selectedIndex].focus();
      }
      if(e.key === 'ArrowLeft'){
        selectCard(Math.max(selectedIndex - 1, 0));
        cards[selectedIndex].focus();
      }
    });
  });

  const sizes = [
    { name: 'Fácil', rows: 9, cols: 9 },
    { name: 'Intermedio', rows: 16, cols: 16 },
    { name: 'Avanzado', rows: 16, cols: 30 },
    { name: 'Experto', rows: 20, cols: 30 }
  ];

  startBtn.addEventListener('click', () => {
    const chosen = sizes[selectedIndex];
    console.log('Dificultad seleccionada:', chosen);
    // Acá se dispararía la inicialización real del tablero
  });
</script>

</body>
</html>
