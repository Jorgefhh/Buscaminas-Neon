<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>

  <!-- Franja decorativa arriba, inspirada en el panel del juego -->
  <div class="franja-panel">
    <div class="caja-panel"><span class="icono-bandera">⚑</span> LOGIN</div>
    <div class="caja-panel caja-boton">INICIAR SESIÓN</div>
    <div class="caja-panel" id="reloj">00:00</div>
  </div>

  <main class="contenedor">
    <div class="tarjeta">
      <h1>Iniciar sesión</h1>

      <form id="form-login">
        <label for="correo">Correo</label>
        <input type="email" id="correo" required placeholder="tuemail@ejemplo.com" />

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" required placeholder="••••••••" />

        <p id="mensaje-error" class="mensaje-error"></p>

        <button type="submit">Ingresar</button>
      </form>

      <p class="texto-secundario">
        ¿No tenés cuenta?
        <a href="registrar.html">Registrate acá</a>
      </p>
    </div>
  </main>

  <!-- api.js va primero porque auth.js usa sus funciones -->
  <script src="../api.js"></script>
  <script src="auth.js"></script>
</body>
</html>
