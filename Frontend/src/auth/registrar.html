<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>

  <div class="franja-panel">
    <div class="caja-panel"><span class="icono-bandera">⚑</span> NUEVO</div>
    <div class="caja-panel caja-boton">REGISTRARSE</div>
    <div class="caja-panel" id="reloj">00:00</div>
  </div>

  <main class="contenedor">
    <div class="tarjeta">
      <h1>Crear cuenta</h1>

      <form id="form-registro">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" required placeholder="Tu nombre" />

        <label for="correo">Correo</label>
        <input type="email" id="correo" required placeholder="tuemail@ejemplo.com" />

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" required placeholder="••••••••" minlength="6" />

        <p id="mensaje-error" class="mensaje-error"></p>
        <p id="mensaje-exito" class="mensaje-exito"></p>

        <button type="submit">Registrarse</button>
      </form>

      <p class="texto-secundario">
        ¿Ya tenés cuenta?
        <a href="login.html">Iniciá sesión</a>
      </p>
    </div>
  </main>

  <script src="../api.js"></script>
  <script src="auth.js"></script>
</body>
</html>
