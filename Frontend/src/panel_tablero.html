<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscaminas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1 class="titulo">Buscaminas - Neon</h1>
  <div class="barra-superior">
    <div class="barra-items">
      <div class="item-control bomba-box">
        <img src="../assets/img/banderaGemi.png" alt="Bomba" class="bomba-icon">
        <span id="bombas-restantes">10</span>
      </div>
      <div class="item-control">
        <button id="reiniciar">Reiniciar</button>
      </div>
      <div class="item-control">
        <div id="tiempo">00:00</div>
      </div>
    </div>
  </div>

  <div class="contenedor-principal">
    <div class="tablero"></div> <!-- Aquí se insertan las celdas dinámicamente -->
    <aside class="panel-estadisticas">
      <h2>Estadísticas</h2>
      <ul>
        <li>Clicks Izq: <span id="estad-clicks-izq">0</span></li>
        <li>Clicks Der: <span id="estad-clicks-der">0</span></li>
        <li>Tiempo transcurrido: <span id="estad-tiempo">00:00</span></li>
        <li>Fecha última partida: <span id="estad-fecha">-</span></li>
        <li>Dificultad: <span id="estad-modo">1</span></li>
        <li>XP ganada: <span id="estad-exp">0</span></li>
      </ul>
    </aside>
  </div>

  <script src = "logica.js"></script>
  <script src="juego.js"></script>
  <script src="api.js"></script>
</body>
</html>
